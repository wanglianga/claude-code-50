services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-db
    environment:
      POSTGRES_DB: ${DB_NAME:-nightpharmacy}
      POSTGRES_USER: ${DB_USER:-night}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nightpass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 数据库不发布到宿主端口，仅在 compose 内部网络通过服务名 postgres 访问
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-night} -d ${DB_NAME:-nightpharmacy}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-nightpharmacy}
      DB_USER: ${DB_USER:-night}
      DB_PASSWORD: ${DB_PASSWORD:-nightpass}
    ports:
      - "${CC_PUBLISH_PORT}:8080"
    volumes:
      - uploads:/app/data/uploads
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
